<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Nomad Scorecard</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@400;500;700&family=Red+Hat+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--forest:#073f2f;--green:#095d42;--leaf:#70a25b;--mint:#e8f0e5;--gold:#e9a63d;--surface:#f4f5f2;--line:#dfe3dd;--ink:#212121;--muted:#5f635f;--red:#b8412f;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Red Hat Text',system-ui,sans-serif;background:var(--surface);color:var(--ink);font-size:14px;line-height:1.4}
header{background:var(--forest);color:var(--white);padding:16px 16px 12px}
header h1{font-family:'Red Hat Display';font-weight:900;font-size:20px;letter-spacing:-.01em}
header p{font-size:12px;opacity:.75;margin-top:2px}
.tabs{display:flex;background:var(--forest);padding:0 6px}
.tab{flex:1;background:none;border:0;color:rgba(255,255,255,.65);font:700 11px 'Red Hat Display';padding:10px 2px;border-bottom:3px solid transparent;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.tab.on{color:var(--white);border-color:var(--gold)}
main{padding:12px 12px 40px;max-width:720px;margin:0 auto}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.monthbar button{background:var(--white);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--green)}
.monthbar .m{font-family:'Red Hat Display';font-weight:900;font-size:18px;color:var(--forest);text-align:center}
.monthbar .q{font-size:11px;color:var(--muted);text-align:center}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.sec{font:700 11px 'Red Hat Display';letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.metric{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.metric:first-of-type{border-top:0;padding-top:2px}
.metric .name{font-weight:700;font-size:14px}
.metric .sub{font-size:11px;color:var(--muted);grid-column:1/-1}
.metric .nums{text-align:right;font-family:'Red Hat Mono';font-size:13px;white-space:nowrap}
.metric .nums b{font-size:18px;color:var(--forest)}
.bar{grid-column:1/-1;height:8px;background:var(--mint);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:4px}
.bar.bad i{background:var(--red)}.bar.warn i{background:var(--gold)}
.pill{display:inline-block;font:700 10px 'Red Hat Display';padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
.ok{background:var(--mint);color:var(--green)}.warn{background:#fbecd0;color:#8a5a0c}.bad{background:#f6dcd7;color:var(--red)}.na{background:var(--surface);color:var(--muted)}
.diag{border-left:4px solid var(--gold);background:#fffaf0;padding:10px 12px;border-radius:0 10px 10px 0;margin-bottom:8px;font-size:13px}
.diag.bad{border-color:var(--red);background:#fdf3f1}
.diag.ok{border-color:var(--leaf);background:var(--mint)}
.diag b{display:block;font-family:'Red Hat Display';margin-bottom:2px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px;font-weight:500}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;background:var(--white);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--leaf);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-block;background:var(--green);color:var(--white);border:0;border-radius:8px;padding:11px 16px;font:700 13px 'Red Hat Display';cursor:pointer;margin-top:12px;margin-right:6px}
.btn.ghost{background:var(--white);color:var(--green);border:1px solid var(--line)}
.btn.danger{background:var(--white);color:var(--red);border:1px solid var(--line)}
.deal{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.deal .t{font-weight:700}.deal .s{font-size:11px;color:var(--muted)}
.deal .a{text-align:right;font-family:'Red Hat Mono';font-size:12px}
.deal .a button{background:none;border:0;color:var(--green);font:700 11px 'Red Hat Display';cursor:pointer;margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:11px;font-family:'Red Hat Mono'}
th,td{padding:5px 3px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:'Red Hat Display';color:var(--muted);font-weight:700}
td:first-child,th:first-child{text-align:left;font-family:'Red Hat Display';font-weight:700;position:sticky;left:0;background:var(--white)}
.scroll{overflow-x:auto}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.chart-title{font:700 14px 'Red Hat Display';color:var(--forest);display:flex;justify-content:space-between;align-items:baseline}
.chart-title span{font:500 11px 'Red Hat Text';color:var(--muted)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin:6px 0 2px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--green);vertical-align:middle;margin-right:4px}
.legend i.goal{border-top:2px dotted var(--gold)}.legend i.fc{border-top:2px dashed var(--leaf)}
svg text{font-family:'Red Hat Mono';font-size:9px;fill:var(--muted)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--forest);color:#fff;padding:8px 14px;border-radius:99px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi div{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:8px}
.kpi b{display:block;font:900 17px 'Red Hat Display';color:var(--forest)}
.kpi small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<header>
  <h1>Revenue Nomad Scorecard</h1>
  <p>Sep 2026 to Aug 2027. Six numbers, monthly pace, gap diagnosis.</p>
</header>
<div class="tabs">
  <button class="tab on" data-t="trend">Trend</button>
  <button class="tab" data-t="pace">Pace</button>
  <button class="tab" data-t="inputs">Inputs</button>
  <button class="tab" data-t="deals">Deals</button>
  <button class="tab" data-t="plan">Plan</button>
</div>
<main>
  <div class="monthbar" id="monthbar">
    <button id="prev">‹</button>
    <div><div class="m" id="mlabel"></div><div class="q" id="qlabel"></div></div>
    <button id="next">›</button>
  </div>
  <div id="view"></div>
</main>
<div class="toast" id="toast"></div>

<script>
// ---------- PLAN ----------
const MONTHS=['Sep 26','Oct 26','Nov 26','Dec 26','Jan 27','Feb 27','Mar 27','Apr 27','May 27','Jun 27','Jul 27','Aug 27'];
const YM=['2026-09','2026-10','2026-11','2026-12','2027-01','2027-02','2027-03','2027-04','2027-05','2027-06','2027-07','2027-08'];
const QUARTER=['Q3 Fix the funnel','Q3 Fix the funnel','Q3 Fix the funnel','Q4 Prove repeatable demand','Q4 Prove repeatable demand','Q4 Prove repeatable demand','Q1 Add capacity','Q1 Add capacity','Q1 Add capacity','Q2 Scale what worked','Q2 Scale what worked','Q2 Scale what worked'];
// Plan rebased on the actual Aug 2026 book (CGI, ACLED, Grow Pro) plus planned closes. New placements modelled at $9k billed, $2,250 kept, 8 months, except the Sep close which is the ApexRx/VinnyMac deal at $4k/$1k.
const ACTIVE_PLAN=[4,5,6,7,8,9,10,11,11,9,10,11];
const GMV_PLAN=[34650,53100,62100,71100,80100,89100,98100,107100,117200,81000,90000,99000];
const PLAN={
  reviews:{name:'Profiles with 3+ reviews',kind:'stock',side:'Supply',sub:'Cumulative. The Behance unlock.',t:[15,35,60,75,90,100,120,135,150,170,185,200]},
  signups:{name:'New operator signups',kind:'flow',side:'Supply',sub:'Per month. 272 on platform at start.',t:[30,35,40,40,45,45,50,55,60,60,60,60]},
  intros:{name:'Intro requests',kind:'flow',side:'Demand',sub:'Per month. The true platform health signal.',t:[5,8,10,10,12,14,15,18,20,22,25,28]},
  calls:{name:'Qualified buyer calls',kind:'flow',side:'Demand',sub:'Per month. First call with a real budget holder.',t:[6,7,7,7,8,9,10,10,10,10,9,9]},
  placed:{name:'Placements closed',kind:'flow',side:'Lagging',sub:'Per month. 15 for the year.',t:[1,1,1,1,1,1,1,1,2,1,2,2]},
  margin:{name:'RN profit',kind:'stock',side:'Lagging',sub:'Per month. What Revenue Nomad keeps.',t:[8338,12950,15200,17450,19700,21950,24200,26450,29050,20250,22500,24750],money:true}
};
const STAGES=['Intro request','Qualified call','Proposal','Closed won','Closed lost','Ended'];
// Deal book as of Sep 1, 2026, reconciled against HubSpot and email.
// CGI keep assumed at 25% of billing until Matt confirms Eric's split.
// ApexRx won Sep 1 (Karry + Jeff Williams both signed). Practice Promotions won Aug 31
// (Neil Trickett signed); billing/keep estimated from the $185/hr operator rate at
// 30 hrs/mo build then 20 hrs/mo ongoing — confirm against the signed SOW.
// Vinnie Mac still open: Sean work-testing Meg and Taylor, decision expected early Sep.
const SEED=[
  {id:'cgi-1',name:'CGI Digital · Revenue Maturity Assessment',stage:'Closed won',qualified:'2026-07',start:'2026-08',end:'2026-09',billing:13750,keep:3438,prob:100,operator:'Eric Clark'},
  {id:'cgi-2',name:'CGI Digital · Fractional CRO',stage:'Closed won',qualified:'2026-07',start:'2026-10',end:'2027-05',billing:23200,keep:5800,prob:100,operator:'Eric Clark'},
  {id:'acled',name:'ACLED',stage:'Closed won',qualified:'2026-07',start:'2026-08',end:'2027-05',billing:13000,keep:3000,prob:100,operator:''},
  {id:'growpro',name:'Grow Pro',stage:'Closed won',qualified:'2026-07',start:'2026-08',end:'2027-04',billing:3900,keep:900,prob:100,operator:''},
  {id:'apexrx',name:'ApexRx · Fractional Sales Director',stage:'Closed won',qualified:'2026-08',start:'2026-09',end:'2027-04',billing:4000,keep:1000,prob:100,operator:'Jeff Williams'},
  {id:'vinnymac',name:'Vinnie Mac · Fractional Director of Sales',stage:'Proposal',qualified:'2026-08',start:'2026-10',end:'2027-05',billing:4000,keep:1000,prob:65,operator:'Meg or Taylor'},
  {id:'pp-1',name:'Practice Promotions · VP Sales build phase',stage:'Closed won',qualified:'2026-08',start:'2026-09',end:'2026-11',billing:7500,keep:1950,prob:100,operator:'Dave VanderJagt (TBC)'},
  {id:'pp-2',name:'Practice Promotions · VP Sales ongoing',stage:'Closed won',qualified:'2026-08',start:'2026-12',end:'2027-04',billing:5000,keep:1300,prob:100,operator:'Dave VanderJagt (TBC)'}
];

// ---------- STATE ----------
let state={inputs:{},deals:[],month:defaultMonth()};
function defaultMonth(){const d=new Date();const idx=(d.getFullYear()-2026)*12+d.getMonth()-8;return Math.min(11,Math.max(0,idx))}
function nowIdx(){const d=new Date();return (d.getFullYear()-2026)*12+d.getMonth()-8}
function monthKey(i){return MONTHS[i]}
function toIdx(ym){if(!ym)return null;const [y,m]=ym.split('-').map(Number);return (y-2026)*12+(m-1)-8}

// ---------- STORAGE ----------
// Data lives in two places: data/state.json published back into this artifact
// (shared across devices, saved with the viewer's authority) and localStorage
// as a same-browser backup. On load the newer of the two wins.
const LS_KEY='rn-scorecard-v2';
let cloud={ns:undefined,ok:null};
async function artifactNS(){
  if(cloud.ns!==undefined)return cloud.ns;
  try{cloud.ns=(window.claude&&window.claude.use)?await window.claude.use('artifact'):null}
  catch(e){cloud.ns=null}
  return cloud.ns}
function readLocal(){try{const v=localStorage.getItem(LS_KEY);return v?JSON.parse(v):null}catch(e){return null}}
async function readPublished(){
  try{const r=await fetch('data/state.json',{cache:'no-store'});if(!r.ok)return null;
    const s=await r.json();return (s&&typeof s==='object')?s:null}
  catch(e){return null}}
async function load(){
  const pub=await readPublished(),loc=readLocal();
  const pick=(pub&&loc)?(((pub.savedAt||0)>=(loc.savedAt||0))?pub:loc):(pub||loc);
  if(pick){state.inputs=pick.inputs||{};state.deals=pick.deals||[]}
  else state.deals=JSON.parse(JSON.stringify(SEED));
  render()}
let syncTimer=null;
function save(msg){
  const data={inputs:state.inputs,deals:state.deals,savedAt:Date.now()};
  let localOk=false;
  try{localStorage.setItem(LS_KEY,JSON.stringify(data));localOk=true}catch(e){}
  toast(msg||'Saved');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>syncCloud(localOk,false),1500)}
async function syncCloud(localOk,retried){
  const ns=await artifactNS();
  if(!ns){if(cloud.ok===null){cloud.ok=false;if(!localOk)toast('Nowhere to save. Open on claude.ai.')}return}
  const data={inputs:state.inputs,deals:state.deals,savedAt:Date.now()};
  try{await ns.publish({'data/state.json':JSON.stringify(data,null,1)});
    if(cloud.ok===false)toast('Back in sync');cloud.ok=true}
  catch(e){const code=e&&e.code;
    if(code==='conflict'){toast('Saved elsewhere first. Reloading latest.');return}
    if(code==='rate_limited'&&!retried){setTimeout(()=>syncCloud(true,true),9000);return}
    if(code==='upstream_error'&&!retried){setTimeout(()=>syncCloud(true,true),2500+Math.random()*2000);return}
    if(cloud.ok!==false){cloud.ok=false;
      toast(localOk?'Saved on this device only':'Read-only view. Changes will not stick.')}}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}

// ---------- DEAL MATH ----------
function weight(d){return (d.stage==='Closed won'||d.stage==='Ended')?1:0}
// Forecast weight: won deals count in full, open deals at their win probability.
// A deal with no probability set falls back to a stage-based default.
function probOf(d){if(d.stage==='Closed won'||d.stage==='Ended')return 1;
  if(d.stage==='Closed lost')return 0;
  const p=Number(d.prob);
  if(d.prob!==''&&d.prob!==null&&d.prob!==undefined&&!isNaN(p))return Math.min(100,Math.max(0,p))/100;
  return {'Intro request':.1,'Qualified call':.25,'Proposal':.5}[d.stage]||0}
function activeIn(d,i){const s=toIdx(d.start),e=toIdx(d.end);if(s===null)return false;if(d.stage==='Closed lost')return false;return s<=i&&(e===null||e>=i)}
function book(i){let gmv=0,profit=0,active=0,won=0,committed=0,fgmv=0,fprofit=0;
  state.deals.forEach(d=>{const w=weight(d),fw=probOf(d);if(activeIn(d,i)){gmv+=(Number(d.billing)||0)*w;profit+=(Number(d.keep)||0)*w;fgmv+=(Number(d.billing)||0)*fw;fprofit+=(Number(d.keep)||0)*fw;active+=w;if(w===1)committed+=Number(d.keep)||0}
    if(toIdx(d.start)===i&&w>0)won+=w});
  return {gmv:Math.round(gmv),profit:Math.round(profit),active:+active.toFixed(1),won:+won.toFixed(1),committed:Math.round(committed),fgmv:Math.round(fgmv),fprofit:Math.round(fprofit)}}
function actuals(i){const inp=state.inputs[monthKey(i)]||{};const b=book(i);
  const callsFromDeals=state.deals.filter(d=>d.stage!=='Intro request'&&toIdx(d.qualified)===i).length;
  return {reviews:num(inp.reviews),signups:num(inp.signups),intros:num(inp.intros),
    calls:inp.calls!==undefined&&inp.calls!==''?Number(inp.calls):(callsFromDeals||null),
    placed:b.won,margin:state.deals.length?b.profit:null,gmv:b.gmv,active:b.active}}
function num(v){return v===undefined||v===''||v===null?null:Number(v)}
function cum(key,upTo,which){let s=0;for(let i=0;i<=upTo;i++){const v=which==='plan'?PLAN[key].t[i]:actuals(i)[key];s+=(v||0)}return s}
function fmt(v,money){if(v===null||v===undefined)return '–';return money?'$'+Math.round(v).toLocaleString():(Number.isInteger(v)?v:v.toFixed(1)).toLocaleString()}
function k(v){return v>=1000?'$'+(v/1000).toFixed(v%1000?1:0)+'k':'$'+v}

// ---------- RENDER ----------
let tab='trend';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});
document.getElementById('prev').onclick=()=>{state.month=Math.max(0,state.month-1);render()};
document.getElementById('next').onclick=()=>{state.month=Math.min(11,state.month+1);render()};

function render(){
  document.getElementById('mlabel').textContent=MONTHS[state.month];
  document.getElementById('qlabel').textContent=QUARTER[state.month];
  document.getElementById('monthbar').style.display=(tab==='trend'||tab==='plan'||tab==='deals')?'none':'flex';
  const v=document.getElementById('view');
  v.innerHTML={trend:renderTrend,pace:renderPace,inputs:renderInputs,deals:renderDeals,plan:renderPlan}[tab]();
  bind();
}

// ----- TREND -----
function lineChart(series,goal,title,subtitle,labels,splitAt,forecast){
  const W=360,H=170,L=38,R=8,T=14,B=24;const n=series.length;const last=n-1;
  const max=Math.max(...series.filter(v=>v!==null),...goal,...(forecast||[]),1)*1.12;
  const x=i=>L+i*(W-L-R)/(n-1);const y=v=>T+(H-T-B)*(1-v/max);
  const path=(arr,from,to)=>{let p='';for(let i=from;i<=to;i++){p+=(i===from?'M':'L')+x(i).toFixed(1)+','+y(arr[i]).toFixed(1)}return p};
  const ticks=[0,.25,.5,.75,1].map(f=>Math.round(max*f));
  let s=`<div class="chart-title">${title}<span>${subtitle}</span></div>
  <div class="legend"><span><i></i>Actual</span><span><i class="goal"></i>Goal</span>${forecast?'<span><i class="fc"></i>Forecast</span>':''}</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  ticks.forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${y(t)+3}" text-anchor="end">${k(t)}</text>`});
  labels.forEach((m,i)=>{s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${m.slice(0,3)}</text>`});
  s+=`<path d="${path(goal,0,last)}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>`;
  if(forecast)s+=`<path d="${path(forecast,0,last)}" fill="none" stroke="var(--leaf)" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>`;
  if(splitAt>=0)s+=`<path d="${path(series,0,splitAt)}" fill="none" stroke="var(--green)" stroke-width="2.5"/>`;
  goal.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="2" fill="var(--gold)"/>`});
  series.forEach((v,i)=>{if(i<=splitAt)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--green)"/>`});
  if(splitAt>=0&&splitAt<=last)s+=`<line x1="${x(splitAt)}" x2="${x(splitAt)}" y1="${T}" y2="${H-B}" stroke="var(--forest)" stroke-width="1" stroke-dasharray="1 3"/>`;
  return s+'</svg>';
}
function renderTrend(){
  const b=MONTHS.map((_,i)=>book(i));const aug=book(-1);
  const TL=['Aug 26',...MONTHS];
  const gmv=[aug.gmv,...b.map(x=>x.gmv)],profit=[aug.profit,...b.map(x=>x.profit)],active=[aug.active,...b.map(x=>x.active)];
  const fgmv=[aug.fgmv,...b.map(x=>x.fgmv)],fprofit=[aug.fprofit,...b.map(x=>x.fprofit)];
  const gmvGoal=[aug.gmv,...GMV_PLAN],profitGoal=[aug.profit,...PLAN.margin.t],activeGoal=[aug.active,...ACTIVE_PLAN];
  const now=nowIdx();const split=Math.min(12,Math.max(-1,now+1));
  const cur=now<0?0:Math.min(11,now);const c=b[cur];
  const past=i=>i<=split; // index into the 13-month arrays
  const yrProfit=profit.reduce((a,v,i)=>a+(i>0&&past(i)?v:0),0),planToDate=PLAN.margin.t.reduce((a,v,i)=>a+(past(i+1)?v:0),0);
  const bookedFwd=profit.reduce((a,v,i)=>a+(i>split?v:0),0);
  const forecastFwd=fprofit.reduce((a,v,i)=>a+(i>split?v:0),0);
  const planProfit=PLAN.margin.t.reduce((a,v)=>a+v,0);
  let h=`<div class="kpi">
    <div><small>${now<0?'Aug 26':MONTHS[cur]} profit</small><b>${k(now<0?aug.profit:c.profit)}</b><span class="note">goal ${now<0?'start':k(PLAN.margin.t[cur])}</span></div>
    <div><small>Profit year to date</small><b>${k(yrProfit)}</b><span class="note">goal to date ${k(planToDate)}</span></div>
    <div><small>Booked ahead</small><b>${k(bookedFwd)}</b><span class="note">forecast ${k(forecastFwd)} of ${k(planProfit-planToDate)} to hit</span></div>
  </div>`;
  h+=`<div class="card">${lineChart(gmv,gmvGoal,'GMV per month','billed to clients',TL,split,fgmv)}</div>`;
  h+=`<div class="card">${lineChart(profit,profitGoal,'RN profit per month','what we keep',TL,split,fprofit)}</div>`;
  h+=`<div class="card scroll"><table><tr><th>Month</th>${TL.map(m=>`<th>${m.slice(0,3)}</th>`).join('')}</tr>
    <tr><td>GMV</td>${gmv.map((v,i)=>`<td>${past(i)?k(v):'–'}</td>`).join('')}</tr>
    <tr><td>GMV goal</td>${gmvGoal.map((v,i)=>`<td>${i?k(v):'start'}</td>`).join('')}</tr>
    <tr><td>Profit</td>${profit.map((v,i)=>`<td>${past(i)?k(v):'–'}</td>`).join('')}</tr>
    <tr><td>Profit goal</td>${profitGoal.map((v,i)=>`<td>${i?k(v):'start'}</td>`).join('')}</tr>
    <tr><td>Profit forecast</td>${fprofit.map(v=>`<td>${k(v)}</td>`).join('')}</tr>
    <tr><td>Gap</td>${profit.map((v,i)=>i&&past(i)?`<td style="color:${v-profitGoal[i]<0?'var(--red)':'var(--green)'}">${v-profitGoal[i]<0?'-':'+'}${k(Math.abs(v-profitGoal[i]))}</td>`:'<td>–</td>').join('')}</tr>
    <tr><td>New placements</td>${[book(-1).won,...b.map(x=>x.won)].map((v,i)=>`<td>${past(i)?v:'–'}</td>`).join('')}</tr>
    <tr><td>Placements goal</td>${[0,...PLAN.placed.t].map((v,i)=>`<td>${i?v:'–'}</td>`).join('')}</tr>
    <tr><td>Active</td>${active.map((v,i)=>`<td>${past(i)?v:'–'}</td>`).join('')}</tr>
    <tr><td>Active goal</td>${activeGoal.map((v,i)=>`<td>${i?v:'start'}</td>`).join('')}</tr>
  </table></div>
  <p class="note">Green is actual, from deals marked Closed won, through the current month. Gold dotted is the goal. The dashed forecast line is won deals plus open deals weighted by win probability (set per deal on the Deals tab; defaults are 10% intro, 25% qualified call, 50% proposal). Booked ahead counts signed contracts only; forecast ahead adds the weighted pipeline. Actuals still count nothing until a deal is marked won.</p>`;
  return h;
}

// ----- PACE -----
function status(key,i){const p=PLAN[key];const a=actuals(i)[key];
  if(a===null||a===undefined)return {cls:'na',pct:0,label:'No data',plan:p.kind==='flow'?cum(key,i,'plan'):p.t[i],act:a};
  const plan=p.kind==='flow'?cum(key,i,'plan'):p.t[i];const act=p.kind==='flow'?cum(key,i,'act'):a;
  const pct=plan?act/plan:1;const cls=pct>=0.9?'ok':pct>=0.7?'warn':'bad';
  return {cls,pct,label:cls==='ok'?'On pace':cls==='warn'?'Behind':'Off track',plan,act}}
function renderPace(){const i=state.month;let html='';
  ['Supply','Demand','Lagging'].forEach(side=>{html+=`<div class="sec">${side}</div><div class="card">`;
    Object.keys(PLAN).filter(x=>PLAN[x].side===side).forEach(x=>{const p=PLAN[x];const s=status(x,i);const a=actuals(i)[x];
      html+=`<div class="metric"><div><div class="name">${p.name}</div><span class="pill ${s.cls}">${s.label}</span></div>
        <div class="nums"><b>${fmt(a,p.money)}</b><br><span style="color:var(--muted)">plan ${fmt(p.t[i],p.money)}</span></div>
        <div class="sub">${p.kind==='flow'?`Year to date ${fmt(s.act,p.money)} of ${fmt(s.plan,p.money)} planned through ${MONTHS[i]}`:p.sub}</div>
        <div class="bar ${s.cls}"><i style="width:${Math.min(100,s.pct*100)}%"></i></div></div>`});
    if(side==='Lagging'){const b=book(i);html+=`<div class="note">GMV ${k(b.gmv)} vs goal ${k(GMV_PLAN[i])}. Active placements ${b.active} vs goal ${ACTIVE_PLAN[i]}. All from Closed won deals only.</div>`}
    html+='</div>'});
  return html+`<div class="sec">Diagnosis</div>`+diagnose(i)}
function diagnose(i){const s={};Object.keys(PLAN).forEach(x=>s[x]=status(x,i));const out=[];
  const bad=x=>s[x].cls==='bad'||s[x].cls==='warn';const okk=x=>s[x].cls==='ok';
  if(['reviews','signups','intros','calls'].every(x=>s[x].cls==='na'))out.push(['warn',`Leading indicators not logged for ${MONTHS[i]}`,'The lagging numbers come from the deal book. Enter reviews, signups, intros and calls on the Inputs tab to get a funnel diagnosis.']);
  if(bad('placed')&&okk('calls'))out.push(['bad','Close rate problem, not a volume problem','Calls are on pace and placements are not. Something in the offer, pricing or candidate presentation is losing deals. Review the last 5 losses before adding outbound.']);
  if(bad('placed')&&bad('calls')&&okk('intros'))out.push(['bad','Intro to call conversion is leaking','Intro requests are arriving but not turning into qualified calls. Check response time on hello@ alerts and whether buyer signup qualifies budget and role.']);
  if(bad('calls')&&bad('intros'))out.push(['bad','Top of funnel is dry','Both intros and calls are behind. This is a traffic and outbound problem. Check organic visitors, SDR touch count, and whether the SEO pages shipped.']);
  if(bad('intros')&&bad('reviews'))out.push(['warn','Thin profiles are suppressing intros','Buyers request intros from profiles with reviews and work samples. Push the review campaign before spending more on traffic.']);
  if(bad('reviews')&&okk('signups'))out.push(['warn','Signups without engagement','Operators join but do not claim or build profiles. Fix onboarding email and headshot pre-load before recruiting more.']);
  if(bad('margin')&&okk('placed'))out.push(['warn','Deals are smaller or shorter than modelled','Placements are landing but profit is behind. Check average keep against the $2,250 assumption and whether engagements end before 5 months.']);
  if(okk('placed')&&okk('margin')&&okk('calls'))out.push(['ok','Demand engine is working','Placements, calls and profit are all on pace. The constraint is your time on first calls. Move the placement lead forward.']);
  if(!out.length)out.push(['warn','Mixed picture','No single pattern. Look at the metric furthest behind plan and work back one step in the funnel.']);
  return out.map(d=>`<div class="diag ${d[0]}"><b>${d[1]}</b>${d[2]}</div>`).join('')}

// ----- INPUTS -----
function renderInputs(){const i=state.month;const inp=state.inputs[monthKey(i)]||{};const ac=actuals(i);
  return `<div class="card"><div style="font:700 15px 'Red Hat Display'">Monthly inputs for ${MONTHS[i]}</div>
    <p class="note">Enter end of month actuals. Placements, GMV and profit come from the Deals tab.</p>
    <label>Profiles with 3+ reviews (cumulative)</label><input type="number" id="in-reviews" value="${inp.reviews??''}" placeholder="plan ${PLAN.reviews.t[i]}">
    <label>New operator signups this month</label><input type="number" id="in-signups" value="${inp.signups??''}" placeholder="plan ${PLAN.signups.t[i]}">
    <label>Intro requests this month</label><input type="number" id="in-intros" value="${inp.intros??''}" placeholder="plan ${PLAN.intros.t[i]}">
    <label>Qualified buyer calls (blank counts from deals, currently ${ac.calls??0})</label><input type="number" id="in-calls" value="${inp.calls??''}" placeholder="plan ${PLAN.calls.t[i]}">
    <label>Organic visitors (diagnostic)</label><input type="number" id="in-visitors" value="${inp.visitors??''}" placeholder="baseline 2,600">
    <label>Outbound touches (diagnostic)</label><input type="number" id="in-touches" value="${inp.touches??''}" placeholder="target 400 to 600">
    <button class="btn" id="save-inputs">Save ${MONTHS[i]}</button></div>
  <div class="card"><div style="font:700 13px 'Red Hat Display'">Data</div>
    <p class="note">Saves land in this artifact automatically, so any device where you open it sees the same numbers. This browser also keeps a local backup.</p>
    <button class="btn ghost" id="export">Copy all data as JSON</button>
    <button class="btn ghost" id="reseed">Reload starting deal book</button>
    <button class="btn danger" id="reset">Clear everything</button></div>`}

// ----- DEALS -----
function renderDeals(){const list=[...state.deals].sort((a,b)=>(b.start||b.qualified||'')>(a.start||a.qualified||'')?1:-1);
  let html=`<div class="card"><div style="font:700 15px 'Red Hat Display'">Log a deal</div>
    <p class="note">Only Closed won rows count toward actuals. Open deals feed the Trend forecast line at their win probability. One row per billing phase. Split a deal if the monthly amount changes, like CGI's assessment then fractional CRO.</p>
    <label>Company or phase</label><input id="d-name" placeholder="e.g. Pool Doctor · Fractional VP Sales">
    <div class="row"><div><label>Stage</label><select id="d-stage">${STAGES.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Win probability % (open deals)</label><input type="number" id="d-prob" min="0" max="100" placeholder="stage default"></div></div>
    <div class="row"><div><label>Qualified call month</label><input type="month" id="d-qual"></div><div><label>First billing month</label><input type="month" id="d-start"></div></div>
    <div class="row"><div><label>Billed to client $/mo</label><input type="number" id="d-bill" placeholder="9000"></div><div><label>We keep $/mo</label><input type="number" id="d-keep" placeholder="2250"></div></div>
    <div class="row"><div><label>Last billing month (churn)</label><input type="month" id="d-end"></div><div><label>Operator</label><input id="d-op" placeholder="Name"></div></div>
    <button class="btn" id="add-deal">Add deal</button></div>`;
  html+=`<div class="sec">Deal book (${state.deals.length})</div><div class="card">`;
  if(!list.length)html+=`<p class="note">No deals. Use Reload starting deal book on the Inputs tab.</p>`;
  list.forEach(d=>{const w=weight(d);
    html+=`<div class="deal"><div><div class="t">${esc(d.name)}</div><div class="s">${d.stage}${w===0&&d.stage!=='Closed lost'?' · '+Math.round(probOf(d)*100)+'% weighted':''}${d.operator?' · '+esc(d.operator):''}${d.start?' · '+d.start:''}${d.end?' to '+d.end:''}</div></div>
      <div class="a">${k(Number(d.billing)||0)} / keep ${k(Number(d.keep)||0)}<br><button data-adv="${d.id}">Next stage</button><button data-lost="${d.id}">Lost</button><button data-del="${d.id}">Delete</button></div></div>`});
  return html+'</div>'}

// ----- PLAN -----
function renderPlan(){let h=`<div class="card scroll"><table><tr><th>Month</th>${Object.keys(PLAN).map(x=>`<th>${PLAN[x].name.split(' ').slice(0,2).join(' ')}</th>`).join('')}<th>GMV</th><th>Active</th></tr>`;
  MONTHS.forEach((m,i)=>{h+=`<tr><td>${m}</td>${Object.keys(PLAN).map(x=>`<td>${fmt(PLAN[x].t[i],PLAN[x].money)}</td>`).join('')}<td>${k(GMV_PLAN[i])}</td><td>${ACTIVE_PLAN[i]}</td></tr>`});
  h+=`</table></div><div class="card"><div style="font:700 13px 'Red Hat Display'">How the plan was built</div>
  <p class="note">Plan starts from the real Aug 2026 book (CGI, ACLED, Grow Pro at 3 active and $7.3k profit) and layers on 15 planned closes, 1 per month with 2 in May, Jul and Aug. Each new placement is modelled at $9k billed, $2,250 kept, 8 months then churn. The Sep close is ApexRx or VinnyMac at $4k/$1k. Year plan is ~$983k GMV, ~$243k RN profit, 11 active in Aug 2027. The June dip is real, that is CGI and ACLED churning, and the plan carries it rather than hiding it.</p>
  <p class="note">Status thresholds. On pace is 90% or better of cumulative plan, Behind is 70% to 90%, Off track is under 70%. Stock metrics compare against the month target, flow metrics compare year to date.</p></div>`;
  return h}
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function thisYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

function bind(){const q=id=>document.getElementById(id);
  if(q('save-inputs'))q('save-inputs').onclick=()=>{const key=monthKey(state.month);state.inputs[key]={reviews:q('in-reviews').value,signups:q('in-signups').value,intros:q('in-intros').value,calls:q('in-calls').value,visitors:q('in-visitors').value,touches:q('in-touches').value};save('Saved '+key)};
  if(q('add-deal'))q('add-deal').onclick=()=>{const name=q('d-name').value.trim();if(!name){toast('Company name needed');return}
    state.deals.push({id:Date.now().toString(36),name,stage:q('d-stage').value,qualified:q('d-qual').value,start:q('d-start').value,end:q('d-end').value,billing:q('d-bill').value,keep:q('d-keep').value,prob:q('d-prob').value,operator:q('d-op').value});save('Deal added');render()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{state.deals=state.deals.filter(d=>d.id!==b.dataset.del);save('Deal removed');render()});
  document.querySelectorAll('[data-lost]').forEach(b=>b.onclick=()=>{const d=state.deals.find(x=>x.id===b.dataset.lost);d.stage='Closed lost';save('Marked lost');render()});
  document.querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>{const d=state.deals.find(x=>x.id===b.dataset.adv);const n=STAGES.indexOf(d.stage);
    if(n<3){d.stage=STAGES[n+1];if(d.stage==='Qualified call'&&!d.qualified)d.qualified=thisYM();if(d.stage==='Closed won'&&!d.start)d.start=thisYM()}
    else if(d.stage==='Closed won'){d.stage='Ended';d.end=d.end||thisYM()}
    save('Moved to '+d.stage);render()});
  if(q('export'))q('export').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify({inputs:state.inputs,deals:state.deals},null,2));toast('Copied')}catch(e){toast('Copy blocked')}};
  if(q('reseed'))q('reseed').onclick=()=>{if(!confirm('Replace the deal book with the Aug 2026 starting book?'))return;state.deals=JSON.parse(JSON.stringify(SEED));save('Deal book reloaded');render()};
  if(q('reset'))q('reset').onclick=()=>{if(!confirm('Clear all inputs and deals?'))return;state.inputs={};state.deals=[];save('Cleared');render()};
}
load();
</script>
</body>
